name: Validate Pigsfield

# Cloudflare Workers Builds deploys main. This workflow validates and checks the live site.
on:
  push:
    branches: [main]
  # Pull requests were not validated before, which is how main came to be failing its own
  # build for weeks without anyone being told.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate site
        run: npm run build

      - name: Run tests
        run: npm test

  smoke:
    name: Post-merge production check
    # Cloudflare deploys from main on its own schedule, so this is a check on the live site
    # rather than a gate on a deployment this workflow performed.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify production crawl surface
        run: npm run check:production
